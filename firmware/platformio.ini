; PD240W firmware - PlatformIO build
;
; Arduino-Pico core (earlephilhower) on the maxgerhardt platform. The core
; bundles the Pico SDK, so the application keeps using pico/* and hardware/*
; APIs directly; src/platform/arduino_compat.cpp routes the SDK console
; (printf, getchar) onto the core's UART driver.
;
;   pio run                      Debug firmware (LOG_DEBUG on)
;   pio run -e pico_release      Release firmware, -Werror on src/
;   pio test -e native           Host unit tests (doctest)

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_upload.maximum_size = 16777216 ; 16 MB external flash, reserves the last 4 KB
monitor_speed = 115200
build_src_flags =
    -Wall
    -Wextra

[env:pico_release]
extends = env:pico
build_flags =
    -D DEBUG_BUILD=0
build_src_flags =
    ${env:pico.build_src_flags}
    -Werror

[env:native]
platform = native
test_framework = doctest
lib_ignore =
    ina228_multiplatform
    tps26750_multiplatform
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I lib/tps26750_multiplatform/include
    -D TPS26750_PLATFORM_NATIVE

