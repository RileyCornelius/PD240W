name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        working-directory: firmware
        run: |
          # Ship the release env: debug logging compiled out (DEBUG_BUILD=0).
          pio run -e pico_release
          mkdir -p ../build
          cp .pio/build/pico_release/firmware.uf2 ../build/PD240W.uf2
          cp .pio/build/pico_release/firmware.elf ../build/PD240W.elf

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          changelog = Path("CHANGELOG.md").read_text().splitlines()
          notes = []
          capture = False

          for line in changelog:
            if line.startswith("## "):
              if capture:
                break
              capture = True

            if capture:
              notes.append(line)

          if not notes:
            raise SystemExit("No release notes found in CHANGELOG.md")

          body = [
              f"## PD240W Firmware {os.environ['VERSION']}",
              "",
              *notes[1:],
              "",
              "### Installation",
              "1. Hold BOOTSEL button while connecting the Pico via USB",
              "2. Drag `PD240W.uf2` to the mounted `RPI-RP2` drive",
              "",
              "### Files",
              "- `PD240W.uf2` - Flash image for USB drag-and-drop",
              "- `PD240W.elf` - Debug binary with symbols (for SWD flashing)",
          ]
          Path("release-body.md").write_text("\n".join(body) + "\n")
          PY

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "PD240W ${{ steps.version.outputs.VERSION }}"
          body_path: release-body.md
          files: |
            build/PD240W.uf2
            build/PD240W.elf
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
